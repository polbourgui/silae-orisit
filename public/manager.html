<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Silae Orisit — Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: #f1f5f9;
      color: #1e293b;
      min-height: 100vh;
    }

    header {
      background: #1e40af;
      color: #fff;
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: .02em; }
    header span { opacity: .6; font-size: 13px; }
    header .spacer { flex: 1; }
    header button { background: rgba(255,255,255,.15); border: 1px solid rgba(255,255,255,.3); color: #fff; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
    header button:hover { background: rgba(255,255,255,.25); }

    .layout { display: flex; height: calc(100vh - 52px); }

    nav {
      width: 220px;
      background: #fff;
      border-right: 1px solid #e2e8f0;
      padding: 16px 0;
      flex-shrink: 0;
    }
    nav .nav-section { padding: 4px 16px 2px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: #94a3b8; }
    nav a {
      display: block;
      padding: 8px 20px;
      color: #475569;
      text-decoration: none;
      font-size: 13px;
      border-left: 3px solid transparent;
    }
    nav a:hover { background: #f8fafc; color: #1e293b; }
    nav a.active { border-left-color: #1e40af; background: #eff6ff; color: #1e40af; font-weight: 500; }

    main { flex: 1; overflow-y: auto; padding: 24px 32px; }

    .page-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
    .page-header h2 { font-size: 20px; font-weight: 600; }
    .page-header p { color: #64748b; margin-top: 2px; font-size: 13px; }

    .week-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 16px;
      margin-bottom: 20px;
    }
    .week-nav button {
      background: none;
      border: 1px solid #e2e8f0;
      border-radius: 4px;
      width: 30px; height: 30px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      color: #475569;
    }
    .week-nav button:hover { background: #f1f5f9; }
    .week-nav .week-label { font-weight: 600; font-size: 15px; min-width: 160px; text-align: center; }
    .week-nav .week-bounds { font-size: 12px; color: #94a3b8; }
    .week-nav .spacer { flex: 1; }

    .columns { display: grid; grid-template-columns: 1fr 400px; gap: 20px; align-items: start; }

    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; overflow: hidden; }
    .card-header {
      padding: 14px 18px;
      border-bottom: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-header h3 { font-size: 14px; font-weight: 600; }
    .card-body { padding: 18px; }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 8px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: #64748b;
      border-bottom: 1px solid #e2e8f0;
      background: #f8fafc;
    }
    td { padding: 9px 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #f8fafc; }

    /* Badges jour */
    .jour-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      text-transform: capitalize;
      white-space: nowrap;
    }
    .jour-lundi    { background: #ede9fe; color: #5b21b6; }
    .jour-mardi    { background: #fce7f3; color: #9d174d; }
    .jour-mercredi { background: #e0f2fe; color: #0369a1; }
    .jour-jeudi    { background: #dcfce7; color: #166534; }
    .jour-vendredi { background: #fef9c3; color: #713f12; }
    .jour-samedi   { background: #ffedd5; color: #9a3412; }
    .jour-dimanche { background: #fee2e2; color: #991b1b; }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      background: #f1f5f9;
      color: #334155;
    }
    .time-range { font-variant-numeric: tabular-nums; color: #334155; white-space: nowrap; }
    .btn-icon {
      background: none; border: none; cursor: pointer;
      color: #94a3b8; padding: 4px 6px; border-radius: 4px; font-size: 15px; line-height: 1;
    }
    .btn-icon:hover { background: #fee2e2; color: #dc2626; }

    .empty-state { text-align: center; padding: 40px 20px; color: #94a3b8; }
    .empty-state .icon { font-size: 32px; margin-bottom: 8px; }

    /* Formulaire */
    .form-section { margin-bottom: 18px; }
    .form-section h4 {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #94a3b8;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #f1f5f9;
    }
    .form-row { display: flex; gap: 10px; margin-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; flex: 1; }
    .form-group label { font-size: 12px; font-weight: 500; color: #475569; }
    .form-group input, .form-group select {
      border: 1px solid #cbd5e1;
      border-radius: 5px;
      padding: 7px 10px;
      font-size: 13px;
      color: #1e293b;
      background: #fff;
      width: 100%;
    }
    .form-group input:focus, .form-group select:focus {
      outline: none; border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }
    .form-group input.error, .form-group select.error { border-color: #f87171; }
    .error-msg { font-size: 11px; color: #dc2626; }

    /* Sélecteur de jours */
    .jours-picker { display: flex; flex-wrap: wrap; gap: 6px; }
    .jour-toggle {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      color: #64748b;
      user-select: none;
      transition: all .1s;
    }
    .jour-toggle.selected {
      border-color: #1e40af;
      background: #eff6ff;
      color: #1e40af;
    }

    /* Presets */
    .presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .preset-btn {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      font-size: 12px;
      cursor: pointer;
      color: #475569;
    }
    .preset-btn:hover { background: #eff6ff; border-color: #93c5fd; color: #1e40af; }

    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 5px; font-size: 13px;
      font-weight: 500; cursor: pointer; border: 1px solid transparent;
    }
    .btn-primary { background: #1e40af; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-primary:disabled { background: #93c5fd; cursor: not-allowed; }
    .btn-secondary { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .btn-secondary:hover { background: #e2e8f0; }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .btn-success:disabled { background: #86efac; cursor: not-allowed; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }
    .btn-full { width: 100%; justify-content: center; }

    .import-zone {
      border: 2px dashed #cbd5e1; border-radius: 6px;
      padding: 16px; text-align: center; cursor: pointer;
      color: #64748b; font-size: 13px; margin-bottom: 10px;
    }
    .import-zone:hover, .import-zone.drag-over { border-color: #3b82f6; background: #eff6ff; color: #1e40af; }
    .import-zone input[type=file] { display: none; }

    .alert {
      padding: 10px 14px; border-radius: 6px; font-size: 13px;
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .alert-error   { background: #fef2f2; color: #dc2626; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #16a34a; border: 1px solid #bbf7d0; }
    .alert-info    { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
      display: inline-block;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stats-bar { display: flex; gap: 16px; margin-bottom: 20px; }
    .stat { background: #fff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px 18px; flex: 1; }
    .stat .value { font-size: 22px; font-weight: 700; color: #1e40af; }
    .stat .label { font-size: 12px; color: #64748b; margin-top: 2px; }

    /* Séparateur de jour dans le tableau */
    .day-separator td {
      background: #f8fafc;
      padding: 5px 12px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .07em;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
    }
  </style>
</head>
<body>

<header>
  <h1>Silae Orisit</h1>
  <span id="site-name">—</span>
  <div class="spacer"></div>
  <span id="manager-name" style="font-size:13px;opacity:.8;margin-right:8px"></span>
  <button id="btn-logout">Déconnexion</button>
</header>

<div class="layout">
  <nav>
    <div class="nav-section">Planning</div>
    <a href="#creneaux" class="active">Créneaux semaine</a>
    <a href="#plannings">Planning &amp; affectations</a>
    <div class="nav-section" style="margin-top:12px">Données</div>
    <a href="#extras">Extras</a>
  </nav>
  <main id="app"><!-- Injecté par Vue --></main>
</div>

<script type="module">
import { createApp, ref, computed, watch, onMounted } from '/vendor/vue.esm-browser.js';

const JOURS = ['lundi','mardi','mercredi','jeudi','vendredi','samedi','dimanche'];
const JOURS_COURT = { lundi:'Lun', mardi:'Mar', mercredi:'Mer', jeudi:'Jeu', vendredi:'Ven', samedi:'Sam', dimanche:'Dim' };

const PRESETS = [
  { label: 'Service midi',  slot_label: 'Service midi',  heure_debut: '11:00', heure_fin: '15:00' },
  { label: 'Service soir',  slot_label: 'Service soir',  heure_debut: '18:00', heure_fin: '23:00' },
  { label: 'Journée',       slot_label: 'Journée',        heure_debut: '09:00', heure_fin: '17:00' },
  { label: 'Matin',         slot_label: 'Matin',          heure_debut: '08:00', heure_fin: '13:00' },
  { label: 'Après-midi',    slot_label: 'Après-midi',     heure_debut: '13:00', heure_fin: '18:00' },
];

function authHeader() {
  const t = localStorage.getItem('manager_token');
  return t ? { Authorization: `Bearer ${t}` } : {};
}

async function apiFetch(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...authHeader(), ...opts.headers },
    ...opts,
  });
  const json = await res.json();
  if (!json.ok) throw new Error(json.error ?? `Erreur ${res.status}`);
  return json.data;
}

function isoWeekFromDate(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const day = d.getUTCDay() || 7;
  d.setUTCDate(d.getUTCDate() + 4 - day);
  const y = d.getUTCFullYear();
  const ys = new Date(Date.UTC(y, 0, 1));
  const w = Math.ceil((((d - ys) / 86400000) + 1) / 7);
  return `${y}-W${String(w).padStart(2, '0')}`;
}

function weekBoundsLabel(isoWeek) {
  const [y, wStr] = isoWeek.split('-W');
  const year = +y, week = +wStr;
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const start = new Date(jan4);
  start.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (week - 1) * 7);
  const end = new Date(start);
  end.setUTCDate(start.getUTCDate() + 6);
  const fmt = d => d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', timeZone: 'UTC' });
  return `${fmt(start)} → ${fmt(end)}`;
}

function offsetWeek(isoWeek, delta) {
  const [y, wStr] = isoWeek.split('-W');
  const year = +y, week = +wStr;
  const jan4 = new Date(Date.UTC(year, 0, 4));
  const mon = new Date(jan4);
  mon.setUTCDate(jan4.getUTCDate() - ((jan4.getUTCDay() || 7) - 1) + (week - 1) * 7);
  mon.setUTCDate(mon.getUTCDate() + delta * 7);
  return isoWeekFromDate(mon);
}

function duration(debut, fin) {
  const [dh, dm] = debut.split(':').map(Number);
  const [fh, fm] = fin.split(':').map(Number);
  const total = (fh * 60 + fm) - (dh * 60 + dm);
  const h = Math.floor(total / 60), m = total % 60;
  return m ? `${h}h${String(m).padStart(2,'0')}` : `${h}h`;
}

// Groupe les créneaux par jour pour l'affichage
function groupByJour(creneaux) {
  const grouped = [];
  let currentJour = null;
  for (const c of creneaux) {
    if (c.jour !== currentJour) {
      grouped.push({ isSeparator: true, jour: c.jour });
      currentJour = c.jour;
    }
    grouped.push({ isSeparator: false, ...c });
  }
  return grouped;
}

const app = createApp({
  setup() {
    const currentWeek = ref(isoWeekFromDate(new Date()));
    const creneaux    = ref([]);
    const postes      = ref([]);
    const loading     = ref(false);
    const saving      = ref(false);
    const alertMsg    = ref(null);

    const form = ref({ slot_label: '', heure_debut: '', heure_fin: '', poste_id: '', jours: ['lundi'] });
    const formErrors = ref({});

    const csvRows   = ref([]);
    const csvParsed = ref(false);

    const weekLabel  = computed(() => currentWeek.value.replace('-W', ' — Semaine '));
    const boundsLabel = computed(() => weekBoundsLabel(currentWeek.value));
    const tableRows  = computed(() => groupByJour(creneaux.value));
    const totalHeures = computed(() =>
      creneaux.value.reduce((sum, c) => {
        const [dh, dm] = c.heure_debut.split(':').map(Number);
        const [fh, fm] = c.heure_fin.split(':').map(Number);
        return sum + ((fh * 60 + fm) - (dh * 60 + dm)) / 60;
      }, 0).toFixed(1)
    );

    async function loadWeek() {
      loading.value = true; alertMsg.value = null;
      try {
        const data = await apiFetch(`/creneaux/semaine/${currentWeek.value}`);
        creneaux.value = data.creneaux;
        postes.value   = data.postes;
      } catch (err) { showAlert('error', err.message); }
      finally { loading.value = false; }
    }

    watch(currentWeek, loadWeek);
    onMounted(loadWeek);

    function showAlert(type, msg) {
      alertMsg.value = { type, msg };
      setTimeout(() => { alertMsg.value = null; }, 4000);
    }

    function toggleJour(jour) {
      const idx = form.value.jours.indexOf(jour);
      if (idx === -1) form.value.jours.push(jour);
      else if (form.value.jours.length > 1) form.value.jours.splice(idx, 1);
    }

    function validateForm(f) {
      const errors = {};
      if (!f.slot_label.trim()) errors.slot_label = 'Libellé requis';
      const re = /^([01]\d|2[0-3]):[0-5]\d$/;
      if (!re.test(f.heure_debut)) errors.heure_debut = 'Format HH:MM';
      if (!re.test(f.heure_fin))   errors.heure_fin   = 'Format HH:MM';
      if (!errors.heure_debut && !errors.heure_fin && f.heure_debut >= f.heure_fin)
        errors.heure_fin = 'Doit être après le début';
      if (!f.jours.length) errors.jours = 'Sélectionnez au moins un jour';
      return errors;
    }

    async function addCreneau() {
      formErrors.value = validateForm(form.value);
      if (Object.keys(formErrors.value).length) return;
      saving.value = true;
      try {
        // Un appel par jour sélectionné
        const toAdd = [...form.value.jours].sort((a, b) => JOURS.indexOf(a) - JOURS.indexOf(b));
        const created = [];
        for (const jour of toAdd) {
          const c = await apiFetch(`/creneaux/semaine/${currentWeek.value}`, {
            method: 'POST',
            body: JSON.stringify({
              jour,
              slot_label:  form.value.slot_label.trim(),
              heure_debut: form.value.heure_debut,
              heure_fin:   form.value.heure_fin,
              poste_id:    form.value.poste_id || null,
            }),
          });
          created.push(c);
        }
        // Insertion triée
        creneaux.value = [...creneaux.value, ...created].sort((a, b) =>
          JOURS.indexOf(a.jour) - JOURS.indexOf(b.jour) ||
          a.heure_debut.localeCompare(b.heure_debut)
        );
        const label = toAdd.length > 1 ? `${toAdd.length} créneaux ajoutés` : 'Créneau ajouté';
        showAlert('success', label);
        form.value.slot_label = ''; form.value.poste_id = '';
      } catch (err) { showAlert('error', err.message); }
      finally { saving.value = false; }
    }

    function applyPreset(p) {
      form.value.slot_label  = p.slot_label;
      form.value.heure_debut = p.heure_debut;
      form.value.heure_fin   = p.heure_fin;
      formErrors.value = {};
    }

    async function deleteCreneau(id) {
      if (!confirm('Supprimer ce créneau ?')) return;
      try {
        await apiFetch(`/creneaux/semaine/${currentWeek.value}/${id}`, { method: 'DELETE' });
        creneaux.value = creneaux.value.filter(c => c.id !== id);
        showAlert('success', 'Créneau supprimé');
      } catch (err) { showAlert('error', err.message); }
    }

    function parseCSV(text) {
      return text.trim().split('\n').filter(l => l.trim()).map(line => {
        const [jour, slot_label, heure_debut, heure_fin, poste_id] =
          line.split(';').map(s => s.trim().replace(/^"|"$/g, ''));
        return { jour: jour || 'lundi', slot_label, heure_debut, heure_fin, poste_id: poste_id || '' };
      }).filter(r => r.slot_label);
    }

    function onFileChange(e) {
      const f = e.target.files[0]; if (!f) return;
      new FileReader().onload = ev => { csvRows.value = parseCSV(ev.target.result); csvParsed.value = true; };
      const r = new FileReader(); r.onload = ev => { csvRows.value = parseCSV(ev.target.result); csvParsed.value = true; }; r.readAsText(f);
    }

    function onDrop(e) {
      e.preventDefault();
      const f = e.dataTransfer.files[0]; if (!f) return;
      const r = new FileReader(); r.onload = ev => { csvRows.value = parseCSV(ev.target.result); csvParsed.value = true; }; r.readAsText(f);
    }

    function cancelImport() { csvRows.value = []; csvParsed.value = false; }

    async function confirmImport() {
      saving.value = true;
      try {
        const result = await apiFetch(`/creneaux/semaine/${currentWeek.value}/batch`, {
          method: 'POST',
          body: JSON.stringify({ creneaux: csvRows.value }),
        });
        creneaux.value = [...creneaux.value, ...result.creneaux].sort((a, b) =>
          JOURS.indexOf(a.jour) - JOURS.indexOf(b.jour) ||
          a.heure_debut.localeCompare(b.heure_debut)
        );
        showAlert('success', `${result.count} créneaux importés`);
        cancelImport();
      } catch (err) { showAlert('error', err.message); }
      finally { saving.value = false; }
    }

    function posteLabel(posteId) {
      return postes.value.find(p => p.id === posteId)?.libelle ?? '—';
    }

    return {
      JOURS, JOURS_COURT, PRESETS,
      currentWeek, weekLabel, boundsLabel,
      creneaux, tableRows, postes, loading, saving, alertMsg,
      form, formErrors,
      csvRows, csvParsed, totalHeures,
      prevWeek: () => { currentWeek.value = offsetWeek(currentWeek.value, -1); },
      nextWeek: () => { currentWeek.value = offsetWeek(currentWeek.value, +1); },
      toggleJour, addCreneau, applyPreset, deleteCreneau,
      onFileChange, onDrop, cancelImport, confirmImport,
      posteLabel, duration,
    };
  },

  template: `
<div>
  <div v-if="alertMsg" :class="['alert','alert-'+alertMsg.type]">
    <span>{{ alertMsg.type === 'error' ? '✕' : '✓' }}</span>{{ alertMsg.msg }}
  </div>

  <div class="page-header">
    <div>
      <h2>Créneaux de la semaine</h2>
      <p>Définissez les créneaux disponibles pour les extras, puis lancez l'algorithme de planning.</p>
    </div>
  </div>

  <div class="week-nav">
    <button @click="prevWeek">‹</button>
    <div>
      <div class="week-label">{{ weekLabel }}</div>
      <div class="week-bounds">{{ boundsLabel }}</div>
    </div>
    <button @click="nextWeek">›</button>
    <div class="spacer"></div>
    <span v-if="loading" style="color:#94a3b8;font-size:13px">Chargement…</span>
    <span v-else style="font-size:13px;color:#64748b">{{ creneaux.length }} créneau(x) · {{ totalHeures }}h total</span>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="value">{{ creneaux.length }}</div>
      <div class="label">Créneaux définis</div>
    </div>
    <div class="stat">
      <div class="value">{{ new Set(creneaux.map(c => c.jour)).size }}</div>
      <div class="label">Jours couverts</div>
    </div>
    <div class="stat">
      <div class="value">{{ totalHeures }}h</div>
      <div class="label">Heures à pourvoir</div>
    </div>
  </div>

  <div class="columns">

    <!-- Tableau créneaux -->
    <div class="card">
      <div class="card-header">
        <h3>Créneaux</h3>
      </div>
      <div v-if="loading" class="empty-state" style="padding:32px">Chargement…</div>
      <div v-else-if="creneaux.length === 0" class="empty-state">
        <div class="icon">📅</div>
        <p>Aucun créneau pour cette semaine.</p>
        <p style="margin-top:4px;font-size:12px">Utilisez le formulaire pour en ajouter.</p>
      </div>
      <table v-else>
        <thead>
          <tr>
            <th>Jour</th>
            <th>Libellé</th>
            <th>Horaires</th>
            <th>Durée</th>
            <th>Poste</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <template v-for="row in tableRows" :key="row.isSeparator ? 'sep-'+row.jour : row.id">
            <tr v-if="row.isSeparator" class="day-separator">
              <td colspan="6">{{ row.jour }}</td>
            </tr>
            <tr v-else>
              <td><span :class="['jour-badge','jour-'+row.jour]">{{ JOURS_COURT[row.jour] }}</span></td>
              <td>{{ row.slot_label }}</td>
              <td class="time-range">{{ row.heure_debut }} → {{ row.heure_fin }}</td>
              <td style="color:#64748b">{{ duration(row.heure_debut, row.heure_fin) }}</td>
              <td style="color:#475569;font-size:12px">{{ posteLabel(row.poste_id) }}</td>
              <td><button class="btn-icon" @click="deleteCreneau(row.id)" title="Supprimer">✕</button></td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Panneau droit -->
    <div style="display:flex;flex-direction:column;gap:16px">

      <!-- Formulaire -->
      <div class="card">
        <div class="card-header"><h3>Ajouter un créneau</h3></div>
        <div class="card-body">

          <div class="form-section">
            <h4>Présets rapides</h4>
            <div class="presets">
              <button v-for="p in PRESETS" :key="p.label" class="preset-btn" @click="applyPreset(p)">{{ p.label }}</button>
            </div>
          </div>

          <div class="form-section">
            <h4>Jours *</h4>
            <div class="jours-picker">
              <span
                v-for="j in JOURS" :key="j"
                :class="['jour-toggle', { selected: form.jours.includes(j) }]"
                @click="toggleJour(j)"
              >{{ JOURS_COURT[j] }}</span>
            </div>
            <div v-if="formErrors.jours" class="error-msg" style="margin-top:4px">{{ formErrors.jours }}</div>
            <div style="font-size:11px;color:#94a3b8;margin-top:6px">
              {{ form.jours.length > 1 ? form.jours.length + ' créneaux seront créés' : '' }}
            </div>
          </div>

          <div class="form-section">
            <h4>Détails</h4>
            <div class="form-group" style="margin-bottom:10px">
              <label>Libellé *</label>
              <input v-model="form.slot_label" :class="{ error: formErrors.slot_label }"
                placeholder="ex: Service midi" @keydown.enter="addCreneau" />
              <span v-if="formErrors.slot_label" class="error-msg">{{ formErrors.slot_label }}</span>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Début *</label>
                <input type="time" v-model="form.heure_debut" :class="{ error: formErrors.heure_debut }" />
                <span v-if="formErrors.heure_debut" class="error-msg">{{ formErrors.heure_debut }}</span>
              </div>
              <div class="form-group">
                <label>Fin *</label>
                <input type="time" v-model="form.heure_fin" :class="{ error: formErrors.heure_fin }" />
                <span v-if="formErrors.heure_fin" class="error-msg">{{ formErrors.heure_fin }}</span>
              </div>
            </div>
            <div class="form-group" style="margin-bottom:14px">
              <label>Poste (optionnel)</label>
              <select v-model="form.poste_id">
                <option value="">— Sans poste —</option>
                <option v-for="p in postes" :key="p.id" :value="p.id">{{ p.libelle }}</option>
              </select>
            </div>
            <button class="btn btn-primary btn-full" @click="addCreneau" :disabled="saving">
              <span v-if="saving" class="spinner"></span>
              <span v-else>
                + {{ form.jours.length > 1 ? 'Ajouter ' + form.jours.length + ' créneaux' : 'Ajouter le créneau' }}
              </span>
            </button>
          </div>

        </div>
      </div>

      <!-- Import CSV -->
      <div class="card">
        <div class="card-header"><h3>Import CSV</h3></div>
        <div class="card-body">
          <div v-if="!csvParsed">
            <p style="font-size:12px;color:#64748b;margin-bottom:10px">
              Format : <code>jour;Libellé;08:00;12:00</code>
            </p>
            <label class="import-zone"
              @dragover.prevent="$event.currentTarget.classList.add('drag-over')"
              @dragleave="$event.currentTarget.classList.remove('drag-over')"
              @drop.prevent="(e) => { e.currentTarget.classList.remove('drag-over'); onDrop(e); }">
              <input type="file" accept=".csv,.txt" @change="onFileChange" />
              <div style="font-size:24px;margin-bottom:6px">📂</div>
              <div>Glissez un fichier CSV ici</div>
              <div style="font-size:11px;margin-top:4px;color:#94a3b8">ou cliquez pour parcourir</div>
            </label>
          </div>
          <div v-else>
            <div class="alert alert-info">{{ csvRows.length }} ligne(s) détectée(s)</div>
            <table style="margin-bottom:12px">
              <thead><tr><th>Jour</th><th>Libellé</th><th>Début</th><th>Fin</th></tr></thead>
              <tbody>
                <tr v-for="(r,i) in csvRows" :key="i">
                  <td><span :class="['jour-badge','jour-'+r.jour]">{{ JOURS_COURT[r.jour] ?? r.jour }}</span></td>
                  <td>{{ r.slot_label }}</td><td>{{ r.heure_debut }}</td><td>{{ r.heure_fin }}</td>
                </tr>
              </tbody>
            </table>
            <div class="form-row">
              <button class="btn btn-secondary btn-sm" @click="cancelImport">Annuler</button>
              <button class="btn btn-success btn-sm" @click="confirmImport" :disabled="saving" style="flex:1;justify-content:center">
                <span v-if="saving" class="spinner"></span>
                <span v-else>Importer {{ csvRows.length }} créneaux</span>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>
  `,
});

// ── Auth guard — monte Vue seulement si token présent ─────────────────────────
const token = localStorage.getItem('manager_token');
if (!token) {
  document.getElementById('app').innerHTML = `
    <div style="max-width:360px;margin:80px auto">
      <div class="card">
        <div class="card-header"><h3>Connexion manager</h3></div>
        <div class="card-body">
          <div id="login-error" class="alert alert-error" style="display:none"></div>
          <div class="form-group" style="margin-bottom:10px">
            <label>Email</label><input id="l-email" type="email" placeholder="manager@exemple.fr" />
          </div>
          <div class="form-group" style="margin-bottom:14px">
            <label>Mot de passe</label><input id="l-pwd" type="password" />
          </div>
          <button class="btn btn-primary btn-full" id="btn-login">Se connecter</button>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('l-email').value;
    const pwd   = document.getElementById('l-pwd').value;
    const errEl = document.getElementById('login-error');
    try {
      const res  = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password:pwd}) });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      localStorage.setItem('manager_token', json.data.token);
      location.reload();
    } catch(err) { errEl.textContent = err.message; errEl.style.display = 'flex'; }
  });
} else {
  app.mount('#app');
  fetch('/auth/me', { headers: { Authorization: `Bearer ${token}` } })
    .then(r => r.json())
    .then(j => {
      if (!j.ok) { localStorage.removeItem('manager_token'); location.reload(); return; }
      document.getElementById('manager-name').textContent = j.data.email ?? '';
    });
  document.getElementById('btn-logout').addEventListener('click', () => {
    localStorage.removeItem('manager_token'); location.reload();
  });
}
</script>
</body>
</html>
