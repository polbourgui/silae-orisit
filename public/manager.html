<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Silae Orisit — Manager</title>
  <link rel="stylesheet" href="/manager-styles.css">
</head>
<body>

<header>
  <h1>Silae Orisit</h1>
  <span id="site-name">—</span>
  <div class="spacer"></div>
  <span id="manager-name" style="font-size:13px;opacity:.8;margin-right:8px"></span>
  <button id="btn-logout">Déconnexion</button>
</header>

<div class="layout">
  <nav id="sidebar-nav">
    <div class="nav-section">Planning</div>
    <a href="#" id="nav-creneaux" class="active">Créneaux semaine</a>
    <a href="#" id="nav-plannings">Planning &amp; affectations</a>
    <div class="nav-section" style="margin-top:12px">Données</div>
    <a href="#" id="nav-extras">Extras</a>
    <a href="#" id="nav-postes">Postes</a>
    <a href="#" id="nav-salles">Salles</a>
  </nav>
  <main id="app"><!-- Injecté par Vue --></main>
</div>

<script type="module">
import { createApp, ref, computed, watch } from '/vendor/vue.esm-browser.js';
import { JOURS, JOURS_COURT, apiFetch, isoWeekFromDate, offsetWeek, weekBoundsLabel, duration, avatarColor, initials } from '/js/manager-utils.js';
import { useCreneaux }      from '/js/use-creneaux.js';
import { TEMPLATE_CRENEAUX } from '/js/template-creneaux.js';
import { usePlanning }      from '/js/use-planning.js';
import { TEMPLATE_PLANNING } from '/js/template-planning.js';
import { useExtras }        from '/js/use-extras.js';
import { TEMPLATE_EXTRAS }  from '/js/template-extras.js';
import { usePostes, TEMPLATE_POSTES } from '/js/use-postes.js';
import { usePointsDeVente, TEMPLATE_POINTS_DE_VENTE } from '/js/use-points-de-vente.js';

const app = createApp({
  setup() {
    const activeView  = ref('creneaux');
    const currentWeek = ref(isoWeekFromDate(new Date()));
    const alertMsg          = ref(null);
    const allPostes         = ref([]);
    const allPointsDeVente  = ref([]);

    function showAlert(type, msg) {
      alertMsg.value = { type, msg };
      setTimeout(() => { alertMsg.value = null; }, 4000);
    }

    const ctx = { activeView, currentWeek, showAlert, allPostes, allPointsDeVente };

    const c = useCreneaux(ctx);
    const p = usePlanning(ctx);
    const e = useExtras(ctx);
    const po  = usePostes(ctx);
    const pdv = usePointsDeVente(ctx);

    const weekLabel   = computed(() => currentWeek.value.replace('-W', ' — Semaine '));
    const boundsLabel = computed(() => weekBoundsLabel(currentWeek.value));

    watch(activeView, v => {
      if (v === 'planning') { p.loadPlanning(); if (allPostes.value.length === 0) po.loadPostes(); if (allPointsDeVente.value.length === 0) pdv.loadPointsDeVente(); }
      if (v === 'extras')   { if (e.eExtras.value.length === 0) e.loadExtras(); if (allPostes.value.length === 0) po.loadPostes(); }
      if (v === 'postes' && allPostes.value.length === 0) po.loadPostes();
      if (v === 'salles') pdv.loadPointsDeVente();
    });

    return {
      JOURS, JOURS_COURT,
      activeView, alertMsg,
      currentWeek, weekLabel, boundsLabel,
      prevWeek: () => { currentWeek.value = offsetWeek(currentWeek.value, -1); },
      nextWeek: () => { currentWeek.value = offsetWeek(currentWeek.value, +1); },
      avatarColor, initials, duration,
      allPostes,
      allPointsDeVente,
      showAlert,
      ...c,
      ...p,
      ...e,
      ...po,
      ...pdv,
    };
  },

  template: `<div>
    <div v-if="alertMsg" :class="['alert','alert-'+alertMsg.type]">
      <span>{{ alertMsg.type === 'error' ? '✕' : '✓' }}</span>{{ alertMsg.msg }}
    </div>
    ${TEMPLATE_CRENEAUX}
    ${TEMPLATE_PLANNING}
    ${TEMPLATE_EXTRAS}
    ${TEMPLATE_POSTES}
    ${TEMPLATE_POINTS_DE_VENTE}
  </div>`,
});

// ── Auth guard ────────────────────────────────────────────────────────────────
const token = localStorage.getItem('manager_token');
if (!token) {
  document.getElementById('app').innerHTML = `
    <div style="max-width:360px;margin:80px auto">
      <div class="card">
        <div class="card-header"><h3>Connexion manager</h3></div>
        <div class="card-body">
          <div id="login-error" class="alert alert-error" style="display:none"></div>
          <div class="form-group" style="margin-bottom:10px">
            <label>Email</label><input id="l-email" type="email" placeholder="manager@exemple.fr" />
          </div>
          <div class="form-group" style="margin-bottom:14px">
            <label>Mot de passe</label><input id="l-pwd" type="password" />
          </div>
          <button class="btn btn-primary btn-full" id="btn-login">Se connecter</button>
        </div>
      </div>
    </div>`;
  document.getElementById('btn-login').addEventListener('click', async () => {
    const email = document.getElementById('l-email').value;
    const pwd   = document.getElementById('l-pwd').value;
    const errEl = document.getElementById('login-error');
    try {
      const res  = await fetch('/auth/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({email, password:pwd}) });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error);
      localStorage.setItem('manager_token', json.data.token);
      location.reload();
    } catch(err) { errEl.textContent = err.message; errEl.style.display = 'flex'; }
  });
} else {
  const vueApp = app.mount('#app');

  const navLinks = [
    { id: 'nav-creneaux', view: 'creneaux' },
    { id: 'nav-plannings', view: 'planning' },
    { id: 'nav-extras',   view: 'extras' },
    { id: 'nav-postes',   view: 'postes' },
    { id: 'nav-salles',   view: 'salles' },
  ];
  navLinks.forEach(({ id, view }) => {
    document.getElementById(id).addEventListener('click', e => {
      e.preventDefault();
      vueApp.activeView = view;
      document.querySelectorAll('nav a').forEach(a => a.classList.remove('active'));
      e.target.classList.add('active');
    });
  });

  fetch('/auth/me', { headers: { Authorization: `Bearer ${token}` } })
    .then(r => r.json())
    .then(j => {
      if (!j.ok) { localStorage.removeItem('manager_token'); location.reload(); return; }
      document.getElementById('manager-name').textContent = j.data.email ?? '';
      if (j.data.site?.nom) document.getElementById('site-name').textContent = j.data.site.nom;
    });
  document.getElementById('btn-logout').addEventListener('click', () => {
    localStorage.removeItem('manager_token'); location.reload();
  });
}
</script>
</body>
</html>
