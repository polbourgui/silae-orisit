<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Mes disponibilités</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
    }
    .header {
      background: #1e40af;
      color: #fff;
      padding: 20px 16px 16px;
    }
    .header h1 { font-size: 18px; font-weight: 700; }
    .header p  { font-size: 13px; opacity: .8; margin-top: 4px; }
    .week-badge {
      display: inline-block;
      margin-top: 8px;
      background: rgba(255,255,255,.2);
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .content { padding: 16px; max-width: 480px; margin: 0 auto; }

    .day-block { margin-bottom: 20px; }
    .day-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: #64748b;
      margin-bottom: 8px;
    }

    .slot-card {
      background: #fff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      -webkit-tap-highlight-color: transparent;
    }
    .slot-card.checked {
      border-color: #22c55e;
      background: #f0fdf4;
    }
    .slot-card.checked .check-icon { background: #22c55e; border-color: #22c55e; }
    .slot-card.checked .check-icon::after { opacity: 1; }

    .check-icon {
      width: 24px; height: 24px; min-width: 24px;
      border: 2px solid #cbd5e1;
      border-radius: 50%;
      position: relative;
      transition: background .15s, border-color .15s;
    }
    .check-icon::after {
      content: '';
      position: absolute;
      top: 4px; left: 7px;
      width: 6px; height: 10px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(45deg);
      opacity: 0;
      transition: opacity .15s;
    }

    .slot-info { flex: 1; min-width: 0; }
    .slot-time { font-size: 15px; font-weight: 700; color: #1e293b; }
    .slot-label { font-size: 13px; color: #64748b; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .slot-poste {
      font-size: 11px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 600;
    }

    .empty-day {
      font-size: 13px;
      color: #94a3b8;
      text-align: center;
      padding: 12px;
    }

    .footer {
      position: sticky;
      bottom: 0;
      background: #fff;
      border-top: 1px solid #e2e8f0;
      padding: 12px 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    .btn-submit {
      width: 100%;
      background: #1e40af;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    .btn-submit:disabled { opacity: .5; cursor: default; }
    .btn-submit:active:not(:disabled) { background: #1e3a8a; }

    .count-pill {
      font-size: 13px;
      color: #64748b;
      text-align: center;
      margin-bottom: 8px;
    }
    .count-pill strong { color: #1e40af; }

    .state-screen {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; min-height: 60vh;
      padding: 32px 24px; text-align: center;
    }
    .state-icon { font-size: 56px; margin-bottom: 16px; }
    .state-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .state-sub   { font-size: 14px; color: #64748b; line-height: 1.5; }

    .spinner {
      width: 36px; height: 36px;
      border: 3px solid #e2e8f0;
      border-top-color: #1e40af;
      border-radius: 50%;
      animation: spin .7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { createApp, ref, computed, onMounted } from '/vendor/vue.esm-browser.js';

const JOURS_LABELS = {
  lundi: 'Lundi', mardi: 'Mardi', mercredi: 'Mercredi',
  jeudi: 'Jeudi', vendredi: 'Vendredi', samedi: 'Samedi', dimanche: 'Dimanche',
};
const JOURS_ORDER = ['lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi', 'dimanche'];

function formatTime(t) { return t ? t.slice(0, 5) : t; }

function jourDate(isoWeek, jour) {
  if (!isoWeek || !jour) return jour;
  const [year, wStr] = isoWeek.split('-W');
  const jan4 = new Date(parseInt(year), 0, 4);
  const monday = new Date(jan4);
  monday.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1 + (parseInt(wStr, 10) - 1) * 7);
  const dayIdx = JOURS_ORDER.indexOf(jour);
  const d = new Date(monday);
  d.setDate(monday.getDate() + dayIdx);
  return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
}

function weekLabel(isoWeek) {
  if (!isoWeek) return '';
  const [year, wStr] = isoWeek.split('-W');
  const w = parseInt(wStr, 10);
  // ISO week monday
  const jan4 = new Date(parseInt(year), 0, 4);
  const monday = new Date(jan4);
  monday.setDate(jan4.getDate() - (jan4.getDay() || 7) + 1 + (w - 1) * 7);
  const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
  const fmt = d => d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
  return `${fmt(monday)} – ${fmt(sunday)}`;
}

const app = createApp({
  setup() {
    const token = new URLSearchParams(location.search).get('token');
    const state  = ref('loading'); // loading | form | success | error | revoked
    const errMsg = ref('');
    const extra  = ref(null);
    const semaines = ref([]); // [{ semaine, creneaux, checked_ids }]
    const checked  = ref(new Set());
    const saving   = ref(false);

    // Creneaux groupés par semaine puis par jour
    const groupedBySemaine = computed(() => {
      return semaines.value.map(({ semaine, creneaux }) => {
        const byDay = {};
        for (const c of creneaux) {
          if (!byDay[c.jour]) byDay[c.jour] = [];
          byDay[c.jour].push(c);
        }
        const days = JOURS_ORDER.filter(j => byDay[j]).map(j => ({ jour: j, label: JOURS_LABELS[j], slots: byDay[j] }));
        return { semaine, days };
      }).filter(s => s.days.length > 0);
    });

    const totalCreneaux = computed(() => semaines.value.reduce((s, w) => s + w.creneaux.length, 0));
    const checkedCount  = computed(() => checked.value.size);
    const multiSemaine  = computed(() => semaines.value.length > 1);

    async function load() {
      if (!token) { state.value = 'error'; errMsg.value = 'Lien invalide.'; return; }
      try {
        const res = await fetch(`/dispos/${token}`);
        const data = await res.json();
        if (!data.ok) {
          const msg = data.error?.toLowerCase() ?? '';
          state.value = msg.includes('révoqué') ? 'revoked' : 'error';
          errMsg.value = data.error ?? 'Erreur inconnue';
          return;
        }
        extra.value   = data.data.extra;
        semaines.value = data.data.semaines;
        const allChecked = new Set();
        for (const { checked_ids } of data.data.semaines) checked_ids.forEach(id => allChecked.add(id));
        checked.value = allChecked;
        state.value = totalCreneaux.value === 0 ? 'no-creneaux' : 'form';
      } catch {
        state.value = 'error';
        errMsg.value = 'Impossible de charger le formulaire.';
      }
    }

    function toggle(id) {
      if (checked.value.has(id)) checked.value.delete(id);
      else checked.value.add(id);
      checked.value = new Set(checked.value); // trigger reactivity
    }

    async function submit() {
      if (saving.value) return;
      saving.value = true;
      try {
        const res = await fetch(`/dispos/${token}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ creneau_ids: [...checked.value] }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error ?? 'Erreur');
        state.value = 'success';
      } catch (e) {
        errMsg.value = e.message;
      } finally {
        saving.value = false;
      }
    }

    onMounted(load);

    return { state, errMsg, extra, semaines, groupedBySemaine, totalCreneaux, checked, checkedCount, multiSemaine, saving, toggle, submit, weekLabel, formatTime, jourDate };
  },

  template: `
<div>

  <!-- Loading -->
  <div v-if="state === 'loading'" class="state-screen">
    <div class="spinner"></div>
    <p style="color:#64748b;font-size:14px">Chargement…</p>
  </div>

  <!-- Error -->
  <div v-else-if="state === 'error'" class="state-screen">
    <div class="state-icon">❌</div>
    <div class="state-title">Lien invalide</div>
    <div class="state-sub">{{ errMsg }}</div>
  </div>

  <!-- Révoqué -->
  <div v-else-if="state === 'revoked'" class="state-screen">
    <div class="state-icon">🔄</div>
    <div class="state-title">Lien remplacé</div>
    <div class="state-sub">Un nouveau lien vous a été envoyé. Utilisez le lien le plus récent reçu par email.</div>
  </div>

  <!-- No creneaux -->
  <div v-else-if="state === 'no-creneaux'" class="state-screen">
    <div class="state-icon">📅</div>
    <div class="state-title">Aucun créneau</div>
    <div class="state-sub">Aucun créneau n'a encore été défini pour cette semaine. Revenez plus tard.</div>
  </div>

  <!-- Success -->
  <div v-else-if="state === 'success'" class="state-screen">
    <div class="state-icon">✅</div>
    <div class="state-title">Disponibilités enregistrées !</div>
    <div class="state-sub">Merci {{ extra?.prenom }}. Vos disponibilités ont bien été prises en compte.</div>
    <button @click="state = 'form'" style="margin-top:20px;background:#1e40af;color:#fff;border:none;border-radius:10px;padding:12px 24px;font-size:15px;font-weight:600;cursor:pointer">
      Modifier mes disponibilités
    </button>
  </div>

  <!-- Form -->
  <template v-else>
    <div class="header">
      <h1>Vos disponibilités</h1>
      <p v-if="extra">Bonjour {{ extra.prenom }} {{ extra.nom }}</p>
      <span v-if="!multiSemaine" class="week-badge">{{ weekLabel(semaines[0]?.semaine?.iso_week) }}</span>
      <span v-else class="week-badge">{{ semaines.length }} semaines</span>
    </div>

    <div class="content" style="padding-bottom: 100px">
      <p style="font-size:13px;color:#64748b;margin:12px 0 16px">
        Cochez les créneaux pour lesquels vous êtes disponible.
      </p>

      <template v-for="semaineGroup in groupedBySemaine" :key="semaineGroup.semaine.iso_week">
        <div v-if="multiSemaine"
          style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#1e40af;background:#eff6ff;border-radius:8px;padding:6px 12px;margin-bottom:10px;margin-top:16px">
          {{ weekLabel(semaineGroup.semaine.iso_week) }}
        </div>
        <div class="day-block" v-for="group in semaineGroup.days" :key="semaineGroup.semaine.iso_week + group.jour">
          <div class="day-label">{{ jourDate(semaineGroup.semaine.iso_week, group.jour) }}</div>
          <div
            v-for="slot in group.slots"
            :key="slot.id"
            class="slot-card"
            :class="{ checked: checked.has(slot.id) }"
            @click="toggle(slot.id)"
          >
            <div class="check-icon"></div>
            <div class="slot-info">
              <div class="slot-time">{{ formatTime(slot.heure_debut) }} – {{ formatTime(slot.heure_fin) }}</div>
              <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
                <span class="slot-label">{{ slot.slot_label }}</span>
                <span v-if="slot.poste_libelle" class="slot-poste">{{ slot.poste_libelle }}</span>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <div class="footer">
      <div class="count-pill">
        <strong>{{ checkedCount }}</strong> créneau(x) sélectionné(s)
      </div>
      <button class="btn-submit" :disabled="saving" @click="submit">
        {{ saving ? 'Enregistrement…' : 'Confirmer mes disponibilités' }}
      </button>
      <p v-if="errMsg" style="color:#ef4444;font-size:12px;margin-top:8px;text-align:center">{{ errMsg }}</p>
    </div>
  </template>

</div>
  `,
});

app.mount('#app');
</script>
</body>
</html>
